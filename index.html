    function showToast(message, type) {
      const toast = document.getElementById('toast-msg');
      if (!toast) return;
      toast.innerText = message;
      toast.style.background = type === 'error' ? '#e11d48' : (type === 'success' ? '#059669' : '#0f172a');
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 3200);
    }

    /* Sound Synthesizer via Web Audio API */
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx && window.AudioContext) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }
    function playBeep(freq, type, duration) {
      if (!STATE.soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }
    function playSound(name) {
      if (!STATE.soundEnabled) return;
      if (name === 'click') playBeep(600, 'sine', 0.05);
      else if (name === 'correct') {
        playBeep(523, 'triangle', 0.1);
        setTimeout(() => playBeep(659, 'triangle', 0.1), 80);
        setTimeout(() => playBeep(784, 'triangle', 0.2), 160);
      } else if (name === 'wrong') {
        playBeep(260, 'sawtooth', 0.15);
        setTimeout(() => playBeep(180, 'sawtooth', 0.2), 100);
      } else if (name === 'fanfare') {
        playBeep(523, 'triangle', 0.12);
        setTimeout(() => playBeep(659, 'triangle', 0.12), 120);
        setTimeout(() => playBeep(784, 'triangle', 0.15), 240);
        setTimeout(() => playBeep(1046, 'triangle', 0.4), 400);
      }
    }

    function updateHeaderProgress() {
      const menuBar = document.getElementById('menu-bar');
      if (!menuBar) return;
      menuBar.innerHTML = '';
      MENUS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'menu-btn' + (STATE.currentMenu === m.id ? ' active' : '') + (STATE.completedMenus.includes(m.id) ? ' completed' : '');
        btn.innerText = m.label;
        btn.onclick = () => { playSound('click'); navigateTo(m.id); };
        menuBar.appendChild(btn);
      });

      // Progress Calculation
      let p = 0;
      if (STATE.hasStarted) p += 10;
      if (STATE.completedMenus.includes('tujuan')) p += 10;
      if (Object.keys(STATE.apersepsiAnswers).length >= 2) p += 10;
      if (STATE.completedMenus.includes('materi')) p += 15;
      if (Object.keys(STATE.simulasiAnswers).length >= 2) p += 15;
      if (STATE.gameScore > 0) p += 10;
      if (Object.keys(STATE.latihanAnswers).length >= 5) p += 10;
      if (STATE.evaluasiFinished) p += 20;
      if (STATE.refleksi.halBaru) p += 10;
      p = Math.min(100, p);
      document.getElementById('progress-fill').style.width = p + '%';
    }

            <textarea id="ref-1" rows="2" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px;">${STATE.refleksi.halBaru}</textarea>

          <div class="subcard" style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 700; color: #0f172a; display: block; margin-bottom: 6px;">2. Bentuk interaksi apa yang paling sering kamu temui di sekolah/rumah?</label>
            <textarea id="ref-2" rows="2" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px;">${STATE.refleksi.bentukSering}</textarea>
          </div>

          <div class="subcard" style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 700; color: #0f172a; display: block; margin-bottom: 6px;">3. Bagaimana caramu menyelesaikan perbedaan pendapat secara damai?</label>
            <textarea id="ref-3" rows="2" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px;">${STATE.refleksi.resolusiKonflik}</textarea>
          </div>

          <div class="subcard" style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 700; color: #0f172a; display: block; margin-bottom: 6px;">4. Komitmen nyata apa yang akan kamu lakukan untuk interaksi positif?</label>
            <textarea id="ref-4" rows="2" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px;">${STATE.refleksi.komitmenPositif}</textarea>
          </div>

          <div class="nav-footer">
            <button class="btn-secondary" onclick="navigateTo('evaluasi')">← Kembali</button>
            <button class="btn-primary" onclick="saveRefleksi()">Simpan & Lihat Hasil Belajar →</button>
          </div>
        </div>
      `;
    }
    function saveRefleksi() {
      STATE.refleksi.halBaru = document.getElementById('ref-1').value.trim();
      STATE.refleksi.bentukSering = document.getElementById('ref-2').value.trim();
      STATE.refleksi.resolusiKonflik = document.getElementById('ref-3').value.trim();
      STATE.refleksi.komitmenPositif = document.getElementById('ref-4').value.trim();
      playSound('correct');
      saveState();
      navigateTo('hasil');
    }

    /* 11. Hasil Belajar & Rapor Cetak */

      const tgl = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      el.innerHTML = `

            <div>Tanggal: <strong>${tgl}</strong></div>
            <div>Ketuntasan: <strong style="color: ${STATE.evaluasiScore >= 70 ? '#047857' : '#b91c1c'};">${STATE.evaluasiScore >= 70 ? 'TUNTAS' : 'BELUM TUNTAS'}</strong></div>
          </div>

          <div class="grid-3" style="text-align: center; margin-bottom: 24px;">
            <div class="subcard" style="background: #eff6ff;">
              <span style="font-size: 11px; font-weight: 700; color: #2563eb;">NILAI EVALUASI</span>
              <div style="font-size: 32px; font-weight: 800; color: #1e3a8a;">${STATE.evaluasiScore} / 100</div>
              <span style="font-size: 12px; font-weight: 700; color: #1e3a8a;">Predikat: ${predikat}</span>
            </div>
            <div class="subcard" style="background: #ecfdf5;">
              <span style="font-size: 11px; font-weight: 700; color: #059669;">SKOR GAME DETEKTIF</span>
              <div style="font-size: 32px; font-weight: 800; color: #064e3b;">${STATE.gameScore} Poin</div>
              <span style="font-size: 12px; color: #064e3b;">10 Kasus Selesai</span>
            </div>
            <div class="subcard" style="background: #fffbeb;">
              <span style="font-size: 11px; font-weight: 700; color: #d97706;">STATUS PROGRES</span>
              <div style="font-size: 32px; font-weight: 800; color: #78350f;">100%</div>
              <span style="font-size: 12px; color: #78350f;">10 Menu Selesai</span>
            </div>
          </div>

          <h4 style="font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">Catatan Refleksi Diri Siswa:</h4>
          <div style="background: #f8fafc; padding: 12px; border-radius: 8px; font-size: 12px; line-height: 1.6; margin-bottom: 30px;">
            <p><strong>Hal Baru:</strong> ${STATE.refleksi.halBaru || '-'}</p>
            <p><strong>Resolusi Damai:</strong> ${STATE.refleksi.resolusiKonflik || '-'}</p>
            <p><strong>Komitmen Sikap:</strong> ${STATE.refleksi.komitmenPositif || '-'}</p>
          </div>

          <div style="display: flex; justify-content: space-around; text-align: center; font-size: 12px; margin-top: 40px;">
            <div>
              <p>Mengetahui,</p>
              <p style="font-weight: 700;">Guru Mata Pelajaran IPS</p>
              <div style="height: 50px;"></div>
              <p>( ........................................ )</p>
            </div>
            <div>
              <p>Peserta Didik,</p>
              <p style="font-weight: 700;">Kelas VII SMP/MTs</p>
              <div style="height: 50px;"></div>
              <p>( ${STATE.studentName || '........................................'} )</p>
            </div>
          </div>

    }

    // Initial Launch
    renderApp();
  </script>
</body>
